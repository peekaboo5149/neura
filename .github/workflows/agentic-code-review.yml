name: Agentic Code Review

on:
    pull_request:
        types: [opened, synchronize]
    push:
        branches:
            - main

permissions:
    contents: read
    pull-requests: write

jobs:
    agentic-review:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10

            - name: Get changed files
              id: changed-files
              run: |
                  echo "files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(ts|js|json)$' | head -20 | tr '\n' ' ')" >> $GITHUB_OUTPUT

            - name: Run lint on changed files
              id: lint-check
              run: |
                  pnpm install
                  echo "## Lint Results" > review-comment.md
                  echo "" >> review-comment.md

                  for file in ${{ steps.changed-files.outputs.files }}; do
                    if [ -f "$file" ]; then
                      echo "### $file" >> review-comment.md
                      echo '```' >> review-comment.md
                      pnpm eslint "$file" --format compact 2>&1 >> review-comment.md || true
                      echo '```' >> review-comment.md
                      echo "" >> review-comment.md
                    fi
                  done

            - name: Generate AI review
              id: ai-review
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  if [ -z "$OPENAI_API_KEY" ]; then
                    echo "⚠️ OPENAI_API_KEY not set. Skipping AI review." >> review-comment.md
                    exit 0
                  fi

                  echo "" >> review-comment.md
                  echo "## 🤖 Agentic Code Review" >> review-comment.md
                  echo "" >> review-comment.md

                  # Get the diff
                  git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr-diff.txt

                  # Create a prompt for the AI
                  cat > ai-prompt.txt << 'EOF'
                  You are an expert code reviewer. Review the following code changes and provide:
                  1. A summary of what changed
                  2. Potential issues or bugs
                  3. Suggestions for improvement
                  4. Security concerns if any

                  Be concise and actionable. Format your response in markdown.

                  CODE DIFF:
                  EOF

                  cat pr-diff.txt >> ai-prompt.txt

                  # Call OpenAI API
                  curl -s https://api.openai.com/v1/chat/completions \
                    -H "Authorization: Bearer $OPENAI_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d @- << 'CURL_DATA' | jq -r '.choices[0].message.content' >> review-comment.md
                  {
                    "model": "gpt-4o-mini",
                    "messages": [
                      {"role": "system", "content": "You are a helpful code reviewer."},
                      {"role": "user", "content": $(cat ai-prompt.txt | jq -Rs)}
                    ],
                    "max_tokens": 1500,
                    "temperature": 0.3
                  }
                  CURL_DATA

            - name: Post review comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const comment = fs.readFileSync('review-comment.md', 'utf8');

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });

    auto-fix:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install

            - name: Run auto-fix
              run: |
                  pnpm lint:fix || true
                  pnpm format || true

            - name: Check for changes
              id: check-changes
              run: |
                  if git diff --quiet; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push fixes
              if: steps.check-changes.outputs.has_changes == 'true'
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add -A
                  git commit -m "style: auto-fix linting and formatting [skip ci]"
                  git push
