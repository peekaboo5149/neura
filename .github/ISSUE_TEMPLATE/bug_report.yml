name: Bug Report
description: Report a bug or unexpected behavior
title: '[BUG] '
labels: [ 'bug', 'needs triage' ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing issues
      required: true

- type: textarea
  attributes:
    label: Current Behavior
    description: A concise description of what you're experiencing.
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Start Neura with 'pnpm dev'
      2. Send command '...'
      3. See error
  validations:
    required: true

- type: textarea
  attributes:
    label: Environment
    description: |
      Please provide details about your environment:
    value: |
      - Node.js version: [e.g., 18.17.0]
      - Operating System: [e.g., macOS 14, Ubuntu 22.04]
      - Neura version/commit: [e.g., v0.1.0 or commit hash]
      - Package manager: [e.g., pnpm 10.0.0]
  validations:
    required: true

- type: textarea
  attributes:
    label: Logs
    description: |
      Please provide any relevant log output. This will be automatically formatted into code.
    render: shell

- type: textarea
  attributes:
    label: Additional Context
    description: Add any other context about the problem here.
