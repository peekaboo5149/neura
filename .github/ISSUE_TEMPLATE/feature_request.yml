name: Feature Request
description: Suggest a new feature or enhancement
title: '[FEATURE] '
labels: [ 'enhancement', 'needs triage' ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to suggest a feature! Please fill out the information below.

- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if a similar feature request already exists.
    options:
    - label: I have searched the existing issues
      required: true

- type: textarea
  attributes:
    label: Feature Description
    description: A clear and concise description of what you want to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Use Case
    description: Describe the use case or problem this feature would solve.
    placeholder: |
      As a [type of user], I want [goal] so that [benefit].
  validations:
    required: true

- type: textarea
  attributes:
    label: Proposed Solution
    description: Describe the solution you'd like to see.

- type: textarea
  attributes:
    label: Alternatives Considered
    description: Describe any alternative solutions or features you've considered.

- type: dropdown
  attributes:
    label: Priority
    description: How important is this feature to you?
    options:
    - Low - Nice to have
    - Medium - Would improve my workflow
    - High - Blocking my usage
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional Context
    description: Add any other context, screenshots, or examples about the feature request here.
